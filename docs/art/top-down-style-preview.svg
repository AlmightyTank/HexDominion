   <rect width="900" height="760" fill="#192326"/>
  <g font-family="sans-serif" fill="#f5efdb">
    <text x="28" y="35" font-size="22">Top-down military style</text>
    <text x="28" y="61" font-size="14">Draft: faction color first, olive second. No badge frames. Gameplay unchanged.</text>
    <text x="111" y="102" font-size="18">Rifle soldier</text>
    <text x="402" y="102" font-size="18">Tank recolor</text>
    <text x="711" y="102" font-size="18">Barracks</text>
  </g>
  <use href="#soldier" transform="translate(55 112) scale(1.5)"/>
  <use href="#tank" transform="translate(355 112) scale(1.5)"/>
  <use href="#barracks" transform="translate(655 112) scale(1.5)"/>
