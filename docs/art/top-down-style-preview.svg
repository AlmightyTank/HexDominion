  <g font-family="sans-serif" font-size="13" fill="#f5efdb">
    <text x="28" y="442">Faction-colored bodies make ownership the first read; olive stays on equipment and trim.</text>
    <text x="28" y="465">Shared upper-left highlights and dark edges keep the family consistent and silhouettes distinct.</text>
  </g>
  <g font-family="sans-serif" fill="#f5efdb">
    <text x="28" y="510" font-size="18">Soldier turning study</text>
    <text x="28" y="534" font-size="13">Overhead view: helmet, shoulders and backpack top. No visible legs. Same pose rotated around (64,64).</text>
    <text x="137" y="562" font-size="14">Up</text>
    <text x="334" y="562" font-size="14">Right</text>
    <text x="536" y="562" font-size="14">Down</text>
    <text x="740" y="562" font-size="14">Left</text>
  </g>
