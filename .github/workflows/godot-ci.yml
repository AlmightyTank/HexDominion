name: Godot project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          curl --fail --location --retry 3 --output godot.zip \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q godot.zip
          install -m 0755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import and parse project resources
        run: godot --headless --path . --editor --quit

      - name: Run hex and world map smoke tests
        run: godot --headless --path . --script res://tests/run_smoke_tests.gd

      - name: Boot main scene
        run: godot --headless --path . --quit-after 5
