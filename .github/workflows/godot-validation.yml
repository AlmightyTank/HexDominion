name: Godot validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and parse
        run: godot --headless --path . --editor --quit
      - name: Smoke and simulation regressions
        run: godot --headless --path . --script res://tests/run_smoke_tests.gd
      - name: HUD regressions
        run: godot --headless --path . --script res://tests/hud_tests.gd
      - name: Vehicle and transport regressions
        run: godot --headless --path . --script res://tests/vehicle_tests.gd
      - name: Artillery combat and save regressions
        run: godot --headless --path . --script res://tests/artillery_tests.gd
      - name: Aircraft missions and airfield regressions
        run: godot --headless --path . --script res://tests/aircraft_tests.gd
      - name: Naval production, combat and amphibious transport
        run: godot --headless --path . --script res://tests/naval_tests.gd
      - name: Unit artwork and badge regressions
        run: godot --headless --path . --script res://tests/unit_art_checks.gd
      - name: Combined arms orders, grouping and AI regressions
        run: godot --headless --path . --script res://tests/combined_arms_tests.gd
      - name: Startup
        run: godot --headless --path . --quit-after 10
      - name: Render zoom and feedback fixtures
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/infantry_visual_test.gd -- --output="$RUNNER_TEMP/infantry-visuals"
      - name: Render faction and state gallery
        run: HEX_FRONTLINES_ART_CAPTURE="$RUNNER_TEMP/infantry-visuals/roster-gallery.png" xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/unit_art_gallery.gd
      - name: Render mixed vehicles and transport
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/vehicle_visual_test.gd -- --output="$RUNNER_TEMP/infantry-visuals"
      - name: Render artillery bombardment
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/artillery_visual_test.gd -- --output="$RUNNER_TEMP/infantry-visuals"
      - name: Render aircraft flight and air combat
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/aircraft_visual_test.gd -- --output="$RUNNER_TEMP/infantry-visuals"
      - name: Render naval silhouettes, cargo and wakes
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/naval_visual_test.gd -- --output="$RUNNER_TEMP/infantry-visuals"
      - name: Render command HUD and phone sheets
        run: HEX_FRONTLINES_RUNTIME_CAPTURE="$RUNNER_TEMP/infantry-visuals" xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/ui_review.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infantry-visual-review
          path: ${{ runner.temp }}/infantry-visuals/*.png
